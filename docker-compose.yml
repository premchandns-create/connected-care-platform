services:
  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["dotnet","run","--urls","http://0.0.0.0:5080"]
    ports: ["5080:5080"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["sh","-c","npm install && npm run dev -- --host 0.0.0.0"]
    ports: ["5173:5173"]
    depends_on: [backend]
